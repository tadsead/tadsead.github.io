  </defs>
  <rect width="920" height="720" rx="56" fill="url(#bg)"/>
  <circle cx="770" cy="130" r="150" fill="#b31b34" opacity="0.18"/>
  <circle cx="120" cy="600" r="120" fill="#ffffff" opacity="0.08"/>
  <rect x="64" y="64" width="792" height="592" rx="44" fill="url(#panel)"/>

  <g transform="translate(118 140)">

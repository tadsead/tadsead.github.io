    <rect x="68" y="68" width="54" height="54" rx="10" fill="#0f6a39"/>
    <rect x="0" y="136" width="54" height="54" rx="10" fill="#0f6a39"/>
    <rect x="68" y="136" width="54" height="54" rx="10" fill="#0f6a39"/>

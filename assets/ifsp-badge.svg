<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">Arte provisória para o TADS-EAD</title>
  <desc id="desc">Composição visual em verde e vermelho com referência institucional e selo 100% gratuito.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f6a39"/>
      <stop offset="100%" stop-color="#0b4a28"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#edf3ef" stop-opacity="0.96"/>
